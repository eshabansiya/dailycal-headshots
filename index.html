<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headshot Icons</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --ink: #1b1b1b; --muted: #6b6b6b; --line: #deded9;
    --accent: #1b1b1b; --err: #b3261e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .settings { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  label.inline { flex-direction: row; align-items: center; gap: 6px; color: var(--ink); }
  input[type=number], input[type=text], select, textarea { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
  input[type=number] { width: 90px; }
  input[type=color] { width: 36px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
  button { font: inherit; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button:disabled { opacity: .45; cursor: default; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .toolbar .spacer { flex: 1; }
  #status { color: var(--muted); font-size: 13px; }

  .group { border-left: 6px solid var(--group); }
  .group.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .group-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .group-head .gname { font-weight: 600; flex: 1 1 160px; min-width: 0; }
  .group-head .hex { font: 13px ui-monospace, monospace; width: 84px; }
  .group-head .count { color: var(--muted); font-size: 13px; }
  .names { display: block; margin-bottom: 12px; }
  .names textarea { width: 100%; min-height: 72px; font: 13px/1.5 ui-monospace, monospace; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; resize: vertical; }
  .names .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .empty { border: 2px dashed var(--line); border-radius: 8px; padding: 24px 16px; text-align: center; color: var(--muted); cursor: pointer; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .grid:empty { display: none; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .thumb { aspect-ratio: 1; border-radius: 8px; display: grid; place-items: center; overflow: hidden;
    background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .thumb .state { font-size: 13px; color: var(--muted); padding: 8px; text-align: center; }
  .thumb .state.err { color: var(--err); }
  .card .label { width: 100%; font-size: 13px; }
  .card .file { font-size: 11px; color: var(--muted); word-break: break-all; margin-top: -4px; }
  .card select { width: 100%; font-size: 13px; }
  .card .zoom { flex-direction: row; align-items: center; gap: 6px; font-size: 12px; }
  .card .zoom input { flex: 1; min-width: 0; }
  .card .actions { display: flex; gap: 6px; }
  .card .actions button { flex: 1; padding: 5px 0; font-size: 13px; }
  .card .actions button.x { flex: 0 0 34px; }
</style>
</head>
<body>
<main>
  <h1>Headshot icons</h1>
  <p class="sub">Make a group for each set of people, pick its color and list the names, then drop photos into the group. The background is removed in your browser (nothing gets uploaded), and each photo is put on a circle in its group's color.</p>

  <section class="panel settings">
    <label>Output size (px)
      <input type="number" id="size" min="64" max="4096" step="32">
    </label>
    <label>Head size (% of circle)
      <input type="number" id="headSize" min="15" max="90" step="1">
    </label>
    <label>Space above head (%)
      <input type="number" id="topMargin" min="0" max="40" step="1">
    </label>
    <label>Outline (% of circle, 0 = none)
      <input type="number" id="ring" min="0" max="20" step="0.5">
    </label>
    <label>Removal quality
      <select id="model">
        <option value="isnet_quint8">Fast (~40 MB model)</option>
        <option value="isnet_fp16">Balanced (~80 MB)</option>
        <option value="isnet">Best (~170 MB)</option>
      </select>
    </label>
    <label class="inline"><input type="checkbox" id="includeCutouts"> Also zip transparent cutouts</label>
  </section>

  <div class="toolbar">
    <button class="ghost" id="addGroup">+ Add group</button>
    <button class="ghost" id="clearAll">Clear photos</button>
    <span id="status"></span>
    <span class="spacer"></span>
    <button id="downloadAll" disabled>Download all (.zip)</button>
  </div>

  <div id="groups"></div>
  <input type="file" id="fileInput" accept="image/*" multiple hidden>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module">
import { removeBackground } from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm';

const $ = (id) => document.getElementById(id);

// Suggested colors for new groups, in order.
const PASTELS = ['#ffb3c1', '#a0c4ff', '#caffbf', '#ffd6a5', '#bdb2ff', '#9bf6ff', '#fdffb6', '#ffc6ff'];

// ---- Settings and groups (remembered between visits) ----
const DEFAULTS = {
  size: 512, headSize: 45, topMargin: 10, ring: 4, model: 'isnet_fp16', includeCutouts: false,
  groups: [{ id: 1, name: 'Group 1', color: PASTELS[0] }, { id: 2, name: 'Group 2', color: PASTELS[1] }],
};
let settings = structuredClone(DEFAULTS);
try { Object.assign(settings, JSON.parse(localStorage.getItem('headshot-settings') || '{}')); } catch {}
if (!Array.isArray(settings.groups) || !settings.groups.length) settings.groups = structuredClone(DEFAULTS.groups);
const saveSettings = () => { try { localStorage.setItem('headshot-settings', JSON.stringify(settings)); } catch {} };

function bindInput(key, parse, el = $(key)) {
  const prop = el.type === 'checkbox' ? 'checked' : 'value';
  el[prop] = settings[key];
  el.addEventListener('change', () => {
    settings[key] = parse(el[prop]); saveSettings();
    // Model changes apply to photos added afterwards; framing changes re-render instantly.
    if (['size', 'headSize', 'topMargin', 'ring'].includes(key)) items.forEach(renderIcon);
  });
}
bindInput('size', (v) => Math.min(4096, Math.max(64, parseInt(v, 10) || DEFAULTS.size)));
bindInput('headSize', (v) => Math.min(90, Math.max(15, parseFloat(v) || DEFAULTS.headSize)));
bindInput('topMargin', (v) => Math.min(40, Math.max(0, parseFloat(v) || 0)));
bindInput('ring', (v) => Math.min(20, Math.max(0, parseFloat(v) || 0)));
bindInput('model', String);
bindInput('includeCutouts', Boolean);

// ---- Groups ----
const groupEls = new Map(); // group id -> { root, grid, empty, count }
const groupById = (id) => settings.groups.find((g) => g.id === id);
const isHex = (v) => /^#[0-9a-f]{6}$/i.test(v);

function renderGroups() {
  const box = $('groups'); box.innerHTML = ''; groupEls.clear();
  for (const g of settings.groups) {
    const root = document.createElement('section'); root.className = 'panel group';
    root.style.setProperty('--group', g.color);
    root.innerHTML = `
      <div class="group-head">
        <input type="color" title="Group color">
        <input type="text" class="hex" spellcheck="false" title="Hex color">
        <input type="text" class="gname" spellcheck="false" title="Group name">
        <span class="count"></span>
        <button class="ghost add">Add photos</button>
        <button class="ghost del" title="Delete group">✕</button>
      </div>
      <label class="names">Names (one per line). Downloads are named after these.
        <textarea spellcheck="false" placeholder="Jane Doe&#10;John Smith"></textarea>
        <div class="hint"></div>
      </label>
      <datalist></datalist>
      <div class="empty">Drop photos for this group here, or click to choose</div>
      <div class="grid"></div>`;
    const pick = root.querySelector('input[type=color]'), hex = root.querySelector('.hex'), name = root.querySelector('.gname');
    pick.value = hex.value = g.color; name.value = g.name;
    const names = root.querySelector('textarea'), list = root.querySelector('datalist');
    list.id = `names-${g.id}`;
    names.value = g.names || '';
    names.addEventListener('input', () => { g.names = names.value; saveSettings(); assignNames(g.id); });
    const setGroupColor = (v) => {
      g.color = v.toLowerCase(); saveSettings();
      root.style.setProperty('--group', g.color);
      items.filter((it) => it.groupId === g.id).forEach(renderIcon);
    };
    pick.addEventListener('input', () => { hex.value = pick.value; setGroupColor(pick.value); });
    hex.addEventListener('input', () => {
      let v = hex.value.trim(); if (!v.startsWith('#')) v = '#' + v;
      if (isHex(v)) { pick.value = v; setGroupColor(v); }
    });
    name.addEventListener('input', () => { g.name = name.value; saveSettings(); refreshGroupOptions(); });
    root.querySelector('.add').addEventListener('click', () => chooseFiles(g.id));
    root.querySelector('.empty').addEventListener('click', () => chooseFiles(g.id));
    const del = root.querySelector('.del');
    del.disabled = settings.groups.length === 1;
    del.addEventListener('click', () => deleteGroup(g));
    root.addEventListener('dragover', (e) => { e.preventDefault(); root.classList.add('over'); });
    root.addEventListener('dragleave', (e) => { if (!root.contains(e.relatedTarget)) root.classList.remove('over'); });
    root.addEventListener('drop', (e) => { e.preventDefault(); root.classList.remove('over'); addFiles(e.dataTransfer.files, g.id); });
    box.append(root);
    groupEls.set(g.id, { root, grid: root.querySelector('.grid'), empty: root.querySelector('.empty'), count: root.querySelector('.count'), hint: root.querySelector('.hint'), list });
  }
  // Re-attach existing cards to their group's grid.
  items.forEach((it) => groupEls.get(it.groupId).grid.append(it.el.root));
  refreshGroupOptions(); refreshCounts();
  settings.groups.forEach((g) => assignNames(g.id));
}

// ---- Names: pair each group's listed names with its photos ----
const normalize = (n) => n.toLowerCase().replace(/[^a-z0-9]+/g, '');
const groupNames = (g) => [...new Set((g.names || '').split(/\r?\n/).map((n) => n.trim()).filter(Boolean))];

// Photos whose name was typed on the card keep it. The rest get a listed name that
// matches their filename, then any remaining names in the order the photos appear.
function assignNames(groupId) {
  const g = groupById(groupId), el = groupEls.get(groupId);
  const names = groupNames(g);
  const photos = [...el.grid.children].map((card) => items.find((it) => it.el.root === card)).filter(Boolean);
  const taken = new Set(photos.filter((it) => it.manual).map((it) => it.label));
  const auto = photos.filter((it) => !it.manual);
  auto.forEach((it) => { it.label = null; });
  for (const it of auto) {
    const file = normalize(it.name);
    const match = names.find((n) => !taken.has(n) && normalize(n) && file.includes(normalize(n)));
    if (match) { it.label = match; taken.add(match); }
  }
  const remaining = names.filter((n) => !taken.has(n));
  for (const it of auto) if (!it.label && remaining.length) it.label = remaining.shift();
  photos.forEach((it) => { if (document.activeElement !== it.el.label) it.el.label.value = it.label || ''; });

  el.list.replaceChildren(...names.map((n) => new Option(n)));
  const unnamed = photos.filter((it) => !it.label).length;
  el.hint.textContent = !names.length ? '' : [
    `${names.length} name${names.length === 1 ? '' : 's'}`,
    remaining.length && `waiting for a photo: ${remaining.join(', ')}`,
    unnamed && `${unnamed} photo${unnamed === 1 ? '' : 's'} without a name (filename used)`,
  ].filter(Boolean).join(' · ');
}

function addGroup() {
  const id = Math.max(0, ...settings.groups.map((g) => g.id)) + 1;
  const used = new Set(settings.groups.map((g) => g.color));
  const color = PASTELS.find((c) => !used.has(c)) || PASTELS[settings.groups.length % PASTELS.length];
  settings.groups.push({ id, name: `Group ${settings.groups.length + 1}`, color, names: '' });
  saveSettings(); renderGroups();
  groupEls.get(id).root.querySelector('.gname').select();
}

function deleteGroup(g) {
  if (settings.groups.length === 1) return;
  const mine = items.filter((it) => it.groupId === g.id);
  if (mine.length && !confirm(`Delete "${g.name}" and its ${mine.length} photo(s)?`)) return;
  mine.forEach(removeItem);
  settings.groups = settings.groups.filter((x) => x !== g);
  saveSettings(); renderGroups();
}

function refreshGroupOptions() {
  items.forEach((it) => {
    it.el.select.replaceChildren(...settings.groups.map((g) => new Option(g.name || 'Untitled', g.id, false, g.id === it.groupId)));
  });
}

function refreshCounts() {
  for (const [id, el] of groupEls) {
    const n = items.filter((it) => it.groupId === id).length;
    el.count.textContent = n ? `${n} photo${n === 1 ? '' : 's'}` : '';
    el.empty.hidden = n > 0;
  }
}

$('addGroup').addEventListener('click', addGroup);

// ---- Photos ----
let items = [];
let nextId = 1;
let pendingGroup = null;
const baseName = (n) => n.replace(/\.[^.]+$/, '');

function chooseFiles(groupId) { pendingGroup = groupId; $('fileInput').click(); }
$('fileInput').addEventListener('change', (e) => { addFiles(e.target.files, pendingGroup); e.target.value = ''; });

function addFiles(files, groupId) {
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    const it = { id: nextId++, file, name: baseName(file.name), label: null, manual: false, zoom: 1, groupId, status: 'queued', cutout: null, iconBlob: null, iconUrl: null };
    makeCard(it);
    groupEls.get(groupId).grid.append(it.el.root);
    items.push(it);
  }
  refreshGroupOptions(); refreshCounts(); refreshToolbar();
  assignNames(groupId);
  pump();
}

function makeCard(it) {
  const root = document.createElement('div'); root.className = 'card';
  root.innerHTML = `
    <div class="thumb"><div class="state">Waiting…</div></div>
    <input type="text" class="label" spellcheck="false" title="Name for the downloaded file">
    <div class="file"></div>
    <label class="zoom" title="Zoom this photo">Zoom <input type="range" min="70" max="160" value="100"></label>
    <select title="Move to group"></select>
    <div class="actions"><button class="ghost dl" disabled>Download</button><button class="ghost x" title="Remove">✕</button></div>`;
  root.querySelector('.file').textContent = it.file.name;
  it.el = { root, thumb: root.querySelector('.thumb'), select: root.querySelector('select'), dl: root.querySelector('.dl'), label: root.querySelector('.label') };
  it.el.label.placeholder = it.name;
  root.querySelector('.zoom input').addEventListener('input', (e) => { it.zoom = Number(e.target.value) / 100; renderIcon(it); });
  it.el.label.setAttribute('list', `names-${it.groupId}`);
  it.el.label.addEventListener('input', () => {
    const v = it.el.label.value.trim();
    it.manual = Boolean(v); it.label = v || null;
    assignNames(it.groupId);
  });
  it.el.select.addEventListener('change', () => {
    const from = it.groupId;
    it.groupId = Number(it.el.select.value);
    it.el.label.setAttribute('list', `names-${it.groupId}`);
    groupEls.get(it.groupId).grid.append(root);
    assignNames(from); assignNames(it.groupId);
    refreshCounts(); renderIcon(it);
  });
  it.el.dl.addEventListener('click', () => downloadBlob(it.iconBlob, `${fileName(it)}.png`));
  root.querySelector('.x').addEventListener('click', () => removeItem(it));
}

function removeItem(it) {
  items = items.filter((x) => x !== it);
  if (it.iconUrl) URL.revokeObjectURL(it.iconUrl);
  it.el.root.remove(); refreshCounts(); refreshToolbar();
  if (groupEls.has(it.groupId)) assignNames(it.groupId);
}

function showState(it, text, isErr = false) {
  it.el.thumb.innerHTML = '';
  const d = document.createElement('div'); d.className = 'state' + (isErr ? ' err' : ''); d.textContent = text;
  it.el.thumb.append(d);
}

function refreshToolbar() {
  const done = items.filter((i) => i.status === 'done').length;
  const failed = items.filter((i) => i.status === 'error').length;
  const pending = items.length - done - failed;
  $('downloadAll').disabled = done === 0;
  $('status').textContent = items.length
    ? `${done} of ${items.length} ready` + (pending ? `, ${pending} processing` : '') + (failed ? `, ${failed} failed` : '')
    : '';
}

$('clearAll').addEventListener('click', () => [...items].forEach(removeItem));

// ---- Background removal, one photo at a time ----
let busy = false;
async function pump() {
  if (busy) return;
  const it = items.find((i) => i.status === 'queued');
  if (!it) return;
  busy = true; it.status = 'working';
  showState(it, 'Removing background…');
  refreshToolbar();
  try {
    const blob = await removeBackground(it.file, {
      model: settings.model,
      output: { format: 'image/png' },
      progress: (key, cur, total) => {
        if (key.startsWith('fetch') && total) showState(it, `Downloading model ${Math.round((cur / total) * 100)}% (first run only)`);
      },
    });
    it.cutoutBlob = blob;
    it.cutout = await blobToCanvas(blob);
    it.head = findHead(it.cutout);
    it.status = 'done';
    await renderIcon(it);
  } catch (err) {
    console.error(err);
    it.status = 'error';
    showState(it, 'Failed: ' + (err?.message || err), true);
  }
  busy = false; refreshToolbar(); pump();
}

async function blobToCanvas(blob) {
  const bmp = await createImageBitmap(blob);
  const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
  c.getContext('2d').drawImage(bmp, 0, 0); bmp.close?.();
  return c;
}

// ---- Head detection on the cutout's alpha mask ----
// Walks down from the top of the subject, measuring how many opaque pixels each row
// has, to find where the head ends.
// Returns the head's top, width and horizontal center in cutout pixels, or null.
function findHead(src) {
  const { width: W, height: H } = src;
  const d = src.getContext('2d').getImageData(0, 0, W, H).data;
  const count = new Float64Array(H), sumX = new Float64Array(H);
  for (let y = 0; y < H; y++) {
    for (let x = 0, i = y * W * 4 + 3; x < W; x++, i += 4) {
      if (d[i] > 128) { count[y]++; sumX[y] += x; }
    }
  }
  const minRow = Math.max(3, W * 0.02); // ignore stray hair wisps
  const top = count.findIndex((n) => n >= minRow);
  if (top < 0) return null;
  // Average a few rows so ragged hair edges don't look like the neck.
  const smooth = (y) => { let t = 0, k = 0; for (let j = y - 3; j <= y + 3; j++) if (j >= 0 && j < H) { t += count[j]; k++; } return t / k; };
  let maxW = 0, n = 0, sx = 0;
  for (let y = top; y < H; y++) {
    const w = smooth(y);
    // Stop at the neck (width dips below the widest part of the head), at the
    // shoulders (sudden widening), or one head-width down.
    if (y - top > maxW * 0.6 && (w < maxW * 0.9 || w > maxW * 1.6 || y - top > maxW)) break;
    maxW = Math.max(maxW, w); n += count[y]; sx += sumX[y];
  }
  return maxW ? { top, width: maxW, cx: sx / n } : null;
}

// ---- Icon: colored circle with the head centered and sized to fill it.
// The photo is clipped to an inner circle, leaving an outline of the group color
// around it that the shoulders don't cover. The head keeps some space above it.
async function renderIcon(it) {
  if (it.status !== 'done') return;
  const S = settings.size, src = it.cutout;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const ctx = c.getContext('2d');
  ctx.beginPath(); ctx.arc(S / 2, S / 2, S / 2, 0, Math.PI * 2);
  ctx.fillStyle = groupById(it.groupId).color; ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.arc(S / 2, S / 2, S / 2 - (settings.ring / 100) * S, 0, Math.PI * 2); ctx.clip();
  let scale, x, y;
  if (it.head) {
    scale = (settings.headSize / 100) * S / it.head.width * it.zoom;
    y = (settings.topMargin / 100) * S - it.head.top * scale;
    // Don't let the photo's bottom edge end inside the circle.
    if (y + src.height * scale < S) {
      scale = (S - (settings.topMargin / 100) * S) / (src.height - it.head.top);
      y = (settings.topMargin / 100) * S - it.head.top * scale;
    }
    x = S / 2 - it.head.cx * scale;
  } else {
    scale = Math.max(S / src.width, S / src.height) * it.zoom;
    x = (S - src.width * scale) / 2; y = (S - src.height * scale) / 2;
  }
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, x, y, src.width * scale, src.height * scale);
  ctx.restore();

  const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
  if (it.iconUrl) URL.revokeObjectURL(it.iconUrl);
  it.iconBlob = blob; it.iconUrl = URL.createObjectURL(blob);
  const img = new Image(); img.src = it.iconUrl; img.alt = it.name;
  it.el.thumb.innerHTML = ''; it.el.thumb.append(img);
  it.el.dl.disabled = false;
}

// ---- Downloads ----
function downloadBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const safeFolder = (n) => (n || 'Untitled').replace(/[\\/:*?"<>|]+/g, '-').trim() || 'Untitled';
const fileName = (it) => safeFolder(it.label || it.name);

$('downloadAll').addEventListener('click', async () => {
  const zip = new JSZip();
  const used = new Set();
  const unique = (n) => { let out = n, k = 2; while (used.has(out)) out = n.replace(/(\.png)$/, `-${k++}$1`); used.add(out); return out; };
  for (const it of items.filter((i) => i.status === 'done')) {
    const folder = safeFolder(groupById(it.groupId).name);
    zip.file(unique(`${folder}/${fileName(it)}.png`), it.iconBlob);
    if (settings.includeCutouts) zip.file(unique(`${folder}/cutouts/${fileName(it)}.png`), it.cutoutBlob);
  }
  downloadBlob(await zip.generateAsync({ type: 'blob' }), 'headshot-icons.zip');
});

// Dropping outside a group shouldn't navigate away from the page.
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => e.preventDefault());
